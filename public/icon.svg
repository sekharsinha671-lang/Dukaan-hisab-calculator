<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing rim -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Calculator / Counter Screen Card -->
  <rect x="76" y="76" width="360" height="110" rx="24" fill="#022C22" stroke="#0D9488" stroke-width="3"/>
  <text x="406" y="152" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="54" fill="#2DD4BF" text-anchor="end">₹ 0.00</text>
  <text x="100" y="120" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#14B8A6" letter-spacing="2">DUKAAN HISAB</text>

  <!-- Rupee Symbol & Keypad Matrix -->
  <!-- Row 1 -->
  <rect x="76" y="216" width="104" height="76" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="128" y="266" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#F8FAFC" text-anchor="middle">kg</text>

  <rect x="204" y="216" width="104" height="76" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="256" y="266" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#F8FAFC" text-anchor="middle">gm</text>

  <rect x="332" y="216" width="104" height="76" rx="18" fill="url(#coralGrad)"/>
  <text x="384" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle">AC</text>

  <!-- Row 2 -->
  <rect x="76" y="312" width="104" height="76" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="128" y="362" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#F8FAFC" text-anchor="middle">7</text>

  <rect x="204" y="312" width="104" height="76" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="256" y="362" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#F8FAFC" text-anchor="middle">8</text>

  <rect x="332" y="312" width="104" height="76" rx="18" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="384" y="362" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#F8FAFC" text-anchor="middle">9</text>

  <!-- Row 3: Giant Rupee Action Bar -->
  <rect x="76" y="408" width="360" height="76" rx="22" fill="url(#tealGrad)"/>
  <text x="256" y="458" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle">हिसाब करें =</text>
</svg>
